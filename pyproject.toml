[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pid-transit"
version = "0.7.2"
description = "A comprehensive transit data library based on Transmodel, supporting GTFS and NeTEx."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PID-Transit contributors" }]
keywords = [
    "gtfs",
    "gtfs-realtime",
    "netex",
    "transmodel",
    "transit",
    "public-transport",
    "timetable",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "openpyxl>=3.0"
]

[project.optional-dependencies]
rt = [
    "gtfs-realtime-bindings>=1.0",
]
# XSD validation for `netex-check --xsd`. Kept out of the runtime dependencies
# on purpose: two dependencies is a competitive property of this library, and
# one subcommand does not get to spend it. Without the extra, netex-check runs
# its profile rules and says explicitly that it could not check the schema.
xsd = [
    "lxml>=4.9",
]
dev = [
    "pytest>=7",
    "hypothesis>=6",
    "gtfs-realtime-bindings>=1.0",
    "lxml>=4.9",
]

[project.urls]
Repository = "https://github.com/Andreeduardopp/pid-transit"
Issues = "https://github.com/Andreeduardopp/pid-transit/issues"

[project.scripts]
pid-transit = "pid_transit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pid_transit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
